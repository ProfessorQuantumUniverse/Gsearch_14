# Project-wide Gradle settings.
# Docs: https://docs.gradle.org/current/userguide/build_environment.html

# --- Daemon / performance ---
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- AndroidX ---
android.useAndroidX=true
# Each library's R class only contains its own resources, keeping the R class small.
android.nonTransitiveRClass=true
# Non-final resource IDs enable faster incremental builds.
android.nonFinalResIds=true

# --- Kotlin ---
kotlin.code.style=official
